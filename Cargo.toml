[package]
name = "pmdshodh"
version = "0.3.3"
edition = "2024"
# noodles 0.119 needs 1.91; the CI msrv job builds and tests with exactly this version.
rust-version = "1.91"
license = "MIT"
description = "Per-read post-mortem damage (PMD) scoring and filtering of ancient DNA alignments, compatible with PMDtools"
repository = "https://github.com/dpatel511/pmdshodh"
readme = "README.md"
keywords = ["ancient-dna", "bioinformatics", "bam", "damage", "pmdtools"]
categories = ["command-line-utilities", "science"]
# Published crate: code, tests with their data, and the top-level docs (no benchmark scripts).
include = ["src/**/*.rs", "tests/*.rs", "tests/data/*", "tests/oracle/*.py", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
# MD5 of whole reference sequences for CRAM input (src/reference.rs); the version noodles-cram uses.
md-5 = "0.11.0"
noodles = { version = "=0.119.0", features = ["core", "sam", "bam", "cram", "bgzf", "fasta"] }
noodles-util = { version = "=0.88.0", features = ["alignment"] }
rayon = "1.12.0"
serde_json = "1.0.154"
# BGZF (de)compression on the shared thread pool (src/bgzf.rs); the version noodles-bgzf uses.
zlib-rs = "0.6.8"

# Remove temporary output files when a signal ends the run (src/main.rs clean_up_on_signals).
[target."cfg(unix)".dependencies]
signal-hook = "0.4.6"

[target."cfg(windows)".dependencies]
ctrlc = "3.5.3"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
